# Wallpaper settings — edit this file, then apply with:
#   systemctl --user start wallpaper-cycle.service
#
# mode:
#   cycle  — pick a random image from wallpaper_dir on a 30-minute timer
#   static — use static_image only (disables the rotation timer)

mode=cycle

wallpaper_dir="$HOME/wallpapers/Fractal Glass/Favorites"
static_image="$HOME/wallpapers/Fractal Glass/Favorites/3.png"

# awww --resize: crop | fit | stretch | no
resize=stretch
