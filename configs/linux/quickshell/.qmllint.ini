[General]
DisableDefaultImports=false
MaxWarnings=-1

# Quickshell registers some types as uncreatable in .qmltypes (e.g. PanelWindow)
# and exposes others via internal base types qmlls cannot resolve (e.g. GlobalShortcut
# → PostReloadHook). These are false positives; runtime is fine.
# See: https://github.com/quickshell-mirror/quickshell/issues/78
#      https://github.com/quickshell-mirror/quickshell/issues/543
[Warnings]
UncreatableType=disable
UnresolvedType=disable
ImportFailure=disable
